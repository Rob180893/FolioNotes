name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências e gerar build web
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Configurar Capacitor, ícone, barra de status e ponte nativa da caneta Android
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/status-bar@7 @capacitor/assets@3
          node -e "
            const fs = require('fs');
            const cfg = {
              appId: 'com.folionotes.app',
              appName: 'FolioNotes',
              webDir: 'dist',
              plugins: {
                StatusBar: {
                  overlaysWebView: false,
                  style: 'LIGHT',
                  backgroundColor: '#FFFFFF'
                }
              }
            };
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          "
          if [ ! -d android ]; then
            npx cap add android
          fi
          node -e "
            const fs = require('fs');
            const path = require('path');
            const sharp = require('sharp');

            async function main() {
              fs.mkdirSync('assets', { recursive: true });
              const svgIconOnly = '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" fill=\"none\"><rect width=\"1024\" height=\"1024\" fill=\"#4F46E5\"/><g transform=\"translate(224 224) scale(24)\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/></g></svg>';
              const svgForeground = '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" fill=\"none\"><g transform=\"translate(272 272) scale(20)\" stroke=\"#FFFFFF\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/></g></svg>';
              const svgBackground = '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\"><rect width=\"1024\" height=\"1024\" fill=\"#4F46E5\"/></svg>';
              const svgSplash = '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 2732 2732\" fill=\"none\"><rect width=\"2732\" height=\"2732\" fill=\"#F8FAFC\"/><rect x=\"1110\" y=\"1110\" width=\"512\" height=\"512\" rx=\"132\" fill=\"#4F46E5\"/><g transform=\"translate(1222 1222) scale(12)\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/></g></svg>';

              await sharp(Buffer.from(svgIconOnly)).png().toFile('assets/icon-only.png');
              await sharp(Buffer.from(svgForeground)).png().toFile('assets/icon-foreground.png');
              await sharp(Buffer.from(svgBackground)).png().toFile('assets/icon-background.png');
              await sharp(Buffer.from(svgSplash)).png().toFile('assets/splash.png');

              const stylesPath = path.join('android', 'app', 'src', 'main', 'res', 'values', 'styles.xml');
              if (fs.existsSync(stylesPath)) {
                let styles = fs.readFileSync(stylesPath, 'utf8');
                if (!styles.includes('fitsSystemWindows')) {
                  styles = styles.replace(
                    /<style name=\"AppTheme\\.NoActionBar\"[^>]*>/,
                    (m) => m + '\n        <item name=\"android:fitsSystemWindows\">true</item>\n        <item name=\"android:statusBarColor\">#FFFFFF</item>\n        <item name=\"android:windowLightStatusBar\">true</item>'
                  );
                  fs.writeFileSync(stylesPath, styles);
                }
              }

              const v35Dir = path.join('android', 'app', 'src', 'main', 'res', 'values-v35');
              fs.mkdirSync(v35Dir, { recursive: true });
              const v35Styles = '<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <style name=\"AppTheme.NoActionBar\" parent=\"Theme.AppCompat.DayNight.NoActionBar\">\n        <item name=\"windowActionBar\">false</item>\n        <item name=\"windowNoTitle\">true</item>\n        <item name=\"android:background\">@null</item>\n        <item name=\"android:fitsSystemWindows\">true</item>\n        <item name=\"android:windowOptOutEdgeToEdgeEnforcement\">true</item>\n    </style>\n</resources>\n';
              fs.writeFileSync(path.join(v35Dir, 'styles.xml'), v35Styles);

              const mainActivityPath = path.join('android', 'app', 'src', 'main', 'java', 'com', 'folionotes', 'app', 'MainActivity.java');
              const mainActivityJava = [
                'package com.folionotes.app;',
                '',
                'import android.os.Bundle;',
                'import android.view.KeyEvent;',
                'import android.view.MotionEvent;',
                'import android.webkit.WebView;',
                'import com.getcapacitor.BridgeActivity;',
                '',
                'public class MainActivity extends BridgeActivity {',
                '    private static final int STYLUS_BUTTON_MASK =',
                '            MotionEvent.BUTTON_STYLUS_PRIMARY',
                '            | MotionEvent.BUTTON_STYLUS_SECONDARY',
                '            | MotionEvent.BUTTON_SECONDARY;',
                '    private boolean lastEraserState = false;',
                '    private boolean hoverPressPendingClick = false;',
                '    private long hoverPressStartedAt = 0L;',
                '',
                '    @Override',
                '    public void onStart() {',
                '        super.onStart();',
                '        evalJs(\"window.__folioNativeStylusBridgeActive=true;\");',
                '    }',
                '',
                '    private void evalJs(final String script) {',
                '        if (getBridge() == null) return;',
                '        final WebView webView = getBridge().getWebView();',
                '        if (webView == null) return;',
                '        webView.post(() -> webView.evaluateJavascript(script, null));',
                '    }',
                '',
                '    private void updateEraserState(boolean active) {',
                '        if (active == lastEraserState) return;',
                '        lastEraserState = active;',
                '        evalJs(\"window.__folioNativeStylusBridgeActive=true;window.__folioNativeStylusEraser=\" + (active ? \"true\" : \"false\") + \";\");',
                '    }',
                '',
                '    private boolean hasStylusPointer(MotionEvent ev) {',
                '        int count = ev.getPointerCount();',
                '        for (int i = 0; i < count; i++) {',
                '            int tt = ev.getToolType(i);',
                '            if (tt == MotionEvent.TOOL_TYPE_STYLUS || tt == MotionEvent.TOOL_TYPE_ERASER) return true;',
                '        }',
                '        return false;',
                '    }',
                '',
                '    private boolean hasEraserTool(MotionEvent ev) {',
                '        int count = ev.getPointerCount();',
                '        for (int i = 0; i < count; i++) {',
                '            if (ev.getToolType(i) == MotionEvent.TOOL_TYPE_ERASER) return true;',
                '        }',
                '        return false;',
                '    }',
                '',
                '    @Override',
                '    public boolean dispatchTouchEvent(MotionEvent ev) {',
                '        if (hasStylusPointer(ev)) {',
                '            int action = ev.getActionMasked();',
                '            if (action == MotionEvent.ACTION_DOWN || action == MotionEvent.ACTION_POINTER_DOWN) {',
                '                hoverPressPendingClick = false;',
                '            }',
                '            boolean btn = (ev.getButtonState() & STYLUS_BUTTON_MASK) != 0 || hasEraserTool(ev);',
                '            if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {',
                '                updateEraserState(false);',
                '            } else {',
                '                updateEraserState(btn);',
                '            }',
                '        }',
                '        return super.dispatchTouchEvent(ev);',
                '    }',
                '',
                '    @Override',
                '    public boolean dispatchGenericMotionEvent(MotionEvent ev) {',
                '        if (hasStylusPointer(ev)) {',
                '            int action = ev.getActionMasked();',
                '            boolean btn = (ev.getButtonState() & STYLUS_BUTTON_MASK) != 0',
                '                    || hasEraserTool(ev)',
                '                    || action == MotionEvent.ACTION_BUTTON_PRESS;',
                '            if (btn && !lastEraserState) {',
                '                hoverPressPendingClick = true;',
                '                hoverPressStartedAt = System.currentTimeMillis();',
                '            } else if (!btn && lastEraserState && hoverPressPendingClick) {',
                '                hoverPressPendingClick = false;',
                '                if (System.currentTimeMillis() - hoverPressStartedAt < 650L) {',
                '                    evalJs(\"window.dispatchEvent(new CustomEvent(\x27folio-stylus-button-click\x27));\");',
                '                }',
                '            }',
                '            updateEraserState(btn);',
                '        }',
                '        return super.dispatchGenericMotionEvent(ev);',
                '    }',
                '',
                '    @Override',
                '    public boolean dispatchKeyEvent(KeyEvent event) {',
                '        int code = event.getKeyCode();',
                '        if (code == 308 || code == 309) {',
                '            if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {',
                '                hoverPressPendingClick = true;',
                '                hoverPressStartedAt = System.currentTimeMillis();',
                '                updateEraserState(true);',
                '            } else if (event.getAction() == KeyEvent.ACTION_UP) {',
                '                updateEraserState(false);',
                '                if (hoverPressPendingClick && System.currentTimeMillis() - hoverPressStartedAt < 650L) {',
                '                    hoverPressPendingClick = false;',
                '                    evalJs(\"window.dispatchEvent(new CustomEvent(\x27folio-stylus-button-click\x27));\");',
                '                }',
                '            }',
                '        }',
                '        return super.dispatchKeyEvent(event);',
                '    }',
                '}',
                ''
              ].join('\n');
              fs.mkdirSync(path.dirname(mainActivityPath), { recursive: true });
              fs.writeFileSync(mainActivityPath, mainActivityJava);
            }
            main().catch((e) => { console.error(e); process.exit(1); });
          "
          npx @capacitor/assets generate --android --iconBackgroundColor '#4F46E5' --iconBackgroundColorDark '#4F46E5' --splashBackgroundColor '#F8FAFC' --splashBackgroundColorDark '#0F172A'
          npx cap sync android

      - name: Aceitar licenças Android SDK e compilar APK
        working-directory: android
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: folionotes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
