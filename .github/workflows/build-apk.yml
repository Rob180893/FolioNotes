name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências e gerar build web
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Configurar Capacitor e projeto Android
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          node -e "const fs=require('fs'); if(!fs.existsSync('capacitor.config.json')&&!fs.existsSync('capacitor.config.ts')) fs.writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.folionotes.app',appName:'FolioNotes',webDir:'dist'},null,2));"
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Aceitar licenças Android SDK e compilar APK
        working-directory: android
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: folionotes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
